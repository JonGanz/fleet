name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each module is its own Go module (no go.work, by design): every Go job runs
# once per module directory, with the Go version from that module's go.mod.
# cache-dependency-path uses go.* so fleet-cache (go.mod only, no go.sum since
# it has no dependencies) still resolves a cache key.

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [fleet-task, fleet-run, fleet-cache]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: Install tmux
        # fleet-run's tmux integration tests skip without it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux git
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt: files above need formatting"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  staticcheck:
    name: staticcheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [fleet-task, fleet-run, fleet-cache]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [fleet-task, fleet-run, fleet-cache]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck install.sh
        # shellcheck is preinstalled on ubuntu-latest runners.
        run: shellcheck --shell=sh install.sh
